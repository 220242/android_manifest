# Khadas Edge1 (AP6398S / BCM4359) - wpa_supplicant overlay.
disable_scan_offload=1
p2p_disabled=0
tdls_external_control=1
wowlan_triggers=any
# BCM4359 supports 802.11r/k/v; enabling them makes roaming between APs usable
# on a device that is normally wired but may fall back to Wi-Fi.
bgscan="simple:30:-65:240"
