# Khadas Edge1 (AP6398S / BCM4359) - Broadcom vendor library config.
#
# The firmware patchram is loaded by the brcm_patchram service in
# init/init.edge1.rc before the HAL starts, so BtFirmwarePath here is only the
# fallback path libbt-vendor uses if it loads the patch itself.
BluetoothUartDevice = /dev/ttyS0
BluetoothInitialBaudrate = 115200
BluetoothOperationalBaudrate = 1500000
BtFirmwarePath = /vendor/etc/firmware/
BtFirmwareName = BCM4359C0.hcd
# LPM (low power mode) needs the BT_WAKE/HOST_WAKE GPIOs the Edge1 wires up.
UartLowPowerMode = 1
